<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="style Sheet" href="style.css">
</head>

<body>

    <div class="container " style="max-width: 40%;height: 100%; background-color:#a6a0fa ; padding-top: 5px; padding-bottom: 5px; border-radius: 1%;">
        <textarea class="form-control text-end fs-4 bg-dark text-white" id="field1" rows="1" readonly>0</textarea>
        <textarea class="form-control text-end fs-4 bg-dark text-white" id="field2" rows="1" readonly>0</textarea>

        <table style="height: 30%; width: 100%;">
            <tr>
                <td >
                    <input type="button" value="AC" class="btn btn-subtle theme-accent w-100 h-100 " onclick="deleteAll()">
                </td>
                <td>
                    <input type="button" value="history" class="btn btn-subtle theme-accent w-100 h-100" onclick="showHistory()">
                </td>
                <td>
                    <input type="button" value="⌫" class="btn btn-subtle theme-accent w-100 h-100" onclick="backSpace()">
                </td>
                <td>
                    <input type="button" value="" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('')">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="7" class="btn btn-subtle theme-accentt w-100 h-100" onclick="showValue('7')">
                </td>
                <td>
                    <input type="button" value="8" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('8')">
                </td>
                <td>
                    <input type="button" value="9" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('9')">
                </td>
                <td>
                    <input type="button" value="/" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('/')"> 
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="4" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('4')">
                </td>
                <td>
                    <input type="button" value="5" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('5')">
                </td>
                <td>
                    <input type="button" value="6" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('6')">
                </td>
                <td>
                    <input type="button" value="*" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('*')">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="1" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('1')">
                </td>
                <td>
                    <input type="button" value="2"class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('2')">
                </td>
                <td>
                    <input type="button" value="3" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('3')">
                </td>
                <td>
                    <input type="button" value="+" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('+')">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="0" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('0')">
                </td>
                <td>
                    <input type="button" value="." class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('.')">
                </td>
                <td>
                    <input type="button" value="=" class="btn btn-subtle theme-accent w-100 h-100" onclick="calculate()">
                </td>
                <td>
                    <input type="button" value="-" class="btn btn-subtle theme-accent w-100 h-100" onclick="showValue('-')">
                </td>
            </tr>
            
        </table>
        <div class="container">
             <textarea class="form-control text-end fs-4 bg-dark text-white h-100" id="field3"
                readonly>0</textarea>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
