        <table style="height: 30%; width: 100%;">

            <tr>
                <td>

                <td>

                <td>

                </td>
                <td>
                    <input type="button" value="*" class="btn btn-light w-100 h-100" onclick="showValue('*')">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="1" class="btn btn-light w-100 h-100" onclick="showValue('1')">
                </td>
                <td>
                    <input type="button" value="2"class="btn btn-light w-100 h-100" onclick="showValue('2')">
                </td>
                <td>
                    <input type="button" value="3" class="btn btn-light w-100 h-100" onclick="showValue('3')">
                </td>
                <td>
                    <input type="button" value="+" class="btn btn-light w-100 h-100" onclick="showValue('+')">
                </td>
            </tr>
            <tr>
                <td>
                    <input type="button" value="0" class="btn btn-light w-100 h-100" onclick="showValue('0')">
                </td>
                <td>
                    <input type="button" value="." class="btn btn-light w-100 h-100" onclick="showValue('.')">
                </td>
                <td>
                    <input type="button" value="=" class="btn btn-light w-100 h-100" onclick="calculate()">
                </td>
                <td>
                    <input type="button" value="-" class="btn btn-light w-100 h-100" onclick="showValue('-')">
                </td>
            </tr>
            
        </table>
        <div class="container">
             <textarea class="form-control text-end fs-4 bg-dark text-white h-100" id="field3"
                readonly>0</textarea>
        </div>
